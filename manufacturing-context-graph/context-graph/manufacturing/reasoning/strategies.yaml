ontology_id: salt.manufacturing.v1.1
execution:
  engine: parameterized_read_only_cypher
  max_hops: 4
  ontology_id_required: true
  no_inferred_relationships: true
strategies:
- name: bom_requirements
  purpose: Trace explicit work-order BOM requirements to parts.
  parameters:
  - work_order_id
  tool: get_bom_components
- name: schedule_contention
  purpose: Compare explicit schedule slots assigned to the same work center.
  parameters:
  - work_center_id
  - window_start
  - window_end
  cypher: MATCH (slot:ScheduleSlot)-[:ALLOCATED_TO]->(center:WorkCenter) WHERE slot.ontology_id
    = $ontology_id AND center.ontology_id = $ontology_id AND center.id = $work_center_id
    AND slot.plannedStart < $window_end AND slot.plannedEnd > $window_start OPTIONAL
    MATCH (slot)-[:SCHEDULED_FOR]->(workOrder:WorkOrder) WHERE workOrder.ontology_id
    = $ontology_id RETURN slot, workOrder ORDER BY slot.plannedStart
- name: production_lineage
  purpose: Follow explicitly asserted production-event ordering and material use.
  parameters:
  - part_id
  cypher: MATCH (event:ProductionEvent)-[material:CONSUMES_PART|PRODUCES_PART]->(part:Part)
    WHERE event.ontology_id = $ontology_id AND part.ontology_id = $ontology_id AND
    part.id = $part_id OPTIONAL MATCH (previous:ProductionEvent)-[:PRECEDES_EVENT]->(event)
    WHERE previous.ontology_id = $ontology_id OPTIONAL MATCH (event)-[:PRECEDES_EVENT]->(next:ProductionEvent)
    WHERE next.ontology_id = $ontology_id RETURN previous, event, material, part,
    next ORDER BY event.actualStart
- name: supply_coverage
  purpose: Find explicit supplier commitments for a required part.
  parameters:
  - part_id
  cypher: MATCH (commitment:SupplyCommitment)-[:SUPPLIES_PART]->(part:Part) WHERE
    commitment.ontology_id = $ontology_id AND part.ontology_id = $ontology_id AND
    part.id = $part_id MATCH (commitment)-[:COMMITTED_BY]->(supplier:Supplier) WHERE
    supplier.ontology_id = $ontology_id RETURN commitment, supplier, part ORDER BY
    commitment.commitmentDate
- name: supplier_risk_assessment
  purpose: Assess supplier risk for the parts required by a WorkOrder.
  parameters:
  - work_order_id
  cypher: |
    MATCH (wo:WorkOrder {work_order_id: $work_order_id})-[:USES_PART|DEPENDS_ON]->(part:Part)
      <-[:SUPPLIED_BY]-(supplier:Supplier)
    WHERE wo.ontology_id = $ontology_id AND supplier.ontology_id = $ontology_id
    RETURN supplier, part
    ORDER BY supplier.risk_score DESC
- name: schedule_capacity_feasibility
  purpose: Check whether a WorkOrder fits into remaining ScheduleSlot capacity.
  parameters:
  - work_order_id
  cypher: |
    MATCH (wo:WorkOrder {work_order_id: $work_order_id})-[:SCHEDULED_AT]->(center:WorkCenter)
      <-[:ALLOCATED_TO]-(slot:ScheduleSlot)
    WHERE wo.ontology_id = $ontology_id AND slot.ontology_id = $ontology_id
    RETURN wo, slot, center
    ORDER BY slot.planned_start
- name: supplier_performance_trends
  purpose: Aggregate supplier performance metrics for all parts in a WorkOrder BOM.
  parameters:
  - work_order_id
  cypher: |
    MATCH (wo:WorkOrder {work_order_id: $work_order_id})-[:HAS_BILL_OF_MATERIALS]->(:BillOfMaterials)
      -[:DEFINES_REQUIREMENT]->(:MaterialRequirement)-[:REQUIRES_PART]->(part:Part)
      <-[:SUPPLIED_BY]-(supplier:Supplier)
    WHERE wo.ontology_id = $ontology_id AND supplier.ontology_id = $ontology_id
    RETURN supplier, part, supplier.risk_score, supplier.on_time_delivery_pct, supplier.quality_score
    ORDER BY supplier.risk_score DESC
- name: workorder_lifecycle_reasoning
  purpose: Explain WorkOrder lifecycle stage using production-event evidence.
  parameters:
  - work_order_id
  cypher: |
    MATCH (wo:WorkOrder {work_order_id: $work_order_id})<-[:EXECUTES_WORK_ORDER]-(event:ProductionEvent)
    WHERE wo.ontology_id = $ontology_id AND event.ontology_id = $ontology_id
    RETURN wo, event
    ORDER BY event.actual_start
- name: production_shift_analysis
  purpose: Show operator, shift, and reason-code evidence for a WorkOrder.
  parameters:
  - work_order_id
  cypher: |
    MATCH (wo:WorkOrder {work_order_id: $work_order_id})<-[:EXECUTES_WORK_ORDER]-(event:ProductionEvent)
    WHERE wo.ontology_id = $ontology_id AND event.ontology_id = $ontology_id
    RETURN wo, event
    ORDER BY event.shift, event.operator
